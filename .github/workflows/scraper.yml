name: Daily Price Scraper

on:
  schedule:
    # 每天香港時間早上 8:00 (UTC 0:00) 自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動觸發執行

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 抓取完整 Git 歷史以順利執行 rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update price data [$(date +'%Y-%m-%d')]" && git pull --rebase origin main && git push origin main)
