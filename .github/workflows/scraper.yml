name: Daily Price Scraper

on:
  schedule:
    # 0 4 * * * 表示 UTC 時間 04:00，即香港時間 (HKT) 每日中午 12:00
    - cron: '0 4 * * *'
  workflow_dispatch: # 依然保留手動觸發按鈕，方便隨時測試

permissions:
  contents: write # 確保 actions[bot] 有權限寫入 CSV 檔案

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          git commit -m "Auto-update monthly price data [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
